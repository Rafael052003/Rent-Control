<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Casa en Alquiler</title>
<meta name="theme-color" content="#0a1614">
<meta name="description" content="Control de pagos de alquiler y recibos numerados">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Casa">
<style>
:root{
  --bg:#0a1614; --surface:#132522; --surface2:#1a302c;
  --border:#244039; --text:#e8f0ed; --text-mute:#8fa9a3;
  --gold:#e0a93b; --gold-soft:#f0c96e; --teal:#1a9b8a;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --wa: #25D366;
  --ink:#1d2b2a; --teal-print:#0f4c47; --teal2:#16695f; --paper:#f6f1e4; --card:#fffdf8;
  --terra:#c4562f; --line:#e4dcc8; --mute:#7a7466;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
/* MODO CLARO */
body.light-mode {
  --bg:#f2efe9; --surface:#ffffff; --surface2:#e8e3d9;
  --border:#d1c9b8; --text:#1d2b2a; --text-mute:#6b665c;
  --gold:#b77e1b; --gold-soft:#8f6007; --teal:#0f766e;
  --ink:#1d2b2a;
}
body.light-mode .top { background:var(--bg); }
body.light-mode .hero { background:linear-gradient(160deg, #fff, #f9f8f5); }
body.light-mode .keybadge { color:#fff; }
body.light-mode .btn.primary { color:#fff; }
body.light-mode .settings-item .icon-box { background: #f4f0e8; color: var(--teal); }
body.light-mode .modal { background: rgba(0,0,0,.4); }
body.light-mode .sheet { box-shadow: 0 -10px 40px rgba(0,0,0,.1); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;transition: background 0.3s, color 0.3s;}
body.lock{overflow:hidden}
.hidden{display:none!important}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:110px}

/* Header */
.top{background:var(--bg);color:var(--text);padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
  display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute)}
.top h1{margin:2px 0 0;font:700 22px var(--serif);line-height:1.15}
.keybadge{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-soft));
  color:#1a1000;display:grid;place-items:center;font-size:20px;font-weight:700}

main{padding:16px}
h2{font:700 20px var(--serif);margin:0;color:var(--text)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;color:var(--text)}

/* Hero */
.hero{border-radius:22px;padding:22px;margin-bottom:14px;color:var(--text);position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--border)}
.hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 100% 0%,rgba(224,169,59,.12),transparent 60%);pointer-events:none}
.hero>*{position:relative}
.hero.ok{border-color:rgba(74,222,128,.35)}
.hero.pend{border-color:rgba(224,169,59,.35)}
.hero.mora{border-color:rgba(248,113,113,.45)}

.mesnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mesnav button{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
  width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
body.light-mode .mesnav button { background:rgba(0,0,0,.05); }
.mesnav button:active{background:var(--surface2)}
.mesnav div{text-align:center}
.mesnav small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute)}
.mesnav b{font:700 17px var(--serif);color:var(--gold-soft)}

.chip{display:inline-block;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;margin-bottom:10px;
  background:rgba(224,169,59,.15);color:var(--gold-soft);border:1px solid rgba(224,169,59,.3)}
.hero.mora .chip{background:rgba(248,113,113,.15);color:var(--bad);border-color:rgba(248,113,113,.3)}
.hero.ok .chip{background:rgba(74,222,128,.15);color:var(--ok);border-color:rgba(74,222,128,.3)}

.big{font:700 44px var(--serif);color:var(--gold-soft);line-height:1}
.big span{font:400 14px var(--sans);color:var(--text-mute);margin-left:6px}

.bar{height:8px;background:rgba(255,255,255,.08);border-radius:9px;margin:14px 0 8px;overflow:hidden}
body.light-mode .bar { background:rgba(0,0,0,.08); }
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:9px;transition:width .3s}
.meta{font-size:13px;color:var(--text-mute);margin-bottom:14px}

/* Buttons */
.btn{border:1px solid var(--border);border-radius:12px;padding:13px 16px;font:600 15px var(--sans);
  cursor:pointer;background:var(--surface2);color:var(--text);transition:all .15s}
.btn:active{transform:scale(.98);opacity:.9}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1000;border:0;width:100%;
  box-shadow:0 4px 14px rgba(224,169,59,.25)}
.btn.dark{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:rgba(248,113,113,.12);color:var(--bad);border:1px solid rgba(248,113,113,.3)}
.btn.line{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn.wa{background:var(--wa);color:#fff;border:0;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn.wa:active{background:#1da851;}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;color:var(--text)}
.stat small{color:var(--text-mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{display:block;font:700 20px var(--serif);margin-top:4px;color:var(--text)}

/* Section headers */
.sec{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute);margin:20px 4px 10px}

/* Chips pendientes */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{background:rgba(248,113,113,.12);color:var(--bad);border:1px solid rgba(248,113,113,.3);
  border-radius:99px;padding:9px 14px;font:600 13px var(--sans);cursor:pointer}

/* Row (recibo / menú ajustes / deudas) */
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;
  margin-bottom:8px;font:inherit;color:inherit;position:relative;z-index:1;cursor:pointer;transition:all .15s}
.row:active{background:var(--surface2);transform:scale(.99)}
.rl{min-width:84px}
.rl b{display:block;font:700 14px var(--serif);color:var(--gold-soft)}
.rl span{font-size:11px;color:var(--text-mute)}
.rm{flex:1;min-width:0;padding-right:10px}
.rm div{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.rm small{color:var(--text-mute);display:block;white-space:normal;line-height:1.25;margin-top:2px;font-size:12px}
.rr{font:700 16px var(--serif);white-space:nowrap;color:var(--text)}
.rr.void{text-decoration:line-through;color:var(--bad)}
.tag{font-size:10px;background:rgba(248,113,113,.2);color:var(--bad);padding:2px 7px;border-radius:6px;margin-left:6px;font-weight:700}

.banner{background:rgba(224,169,59,.1);border:1px solid rgba(224,169,59,.3);border-radius:14px;
  padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--gold-soft)}
body.light-mode .banner { background: #fff8eb; }

.empty{text-align:center;color:var(--text-mute);padding:28px 10px;font-size:14px}

/* Forms */
label{display:block;font-size:13px;font-weight:600;color:var(--text-mute);margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;
  border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);
  font:16px var(--sans);color:var(--text);appearance:none;-webkit-appearance:none}
body.light-mode input, body.light-mode select, body.light-mode textarea { background: #fff; }
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--text-mute);opacity:.7}
select{background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23e0a93b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  background-repeat:no-repeat;background-position:right 12px top 50%;background-size:12px auto;padding-right:35px}

label.chk{display:flex;gap:10px;align-items:center;color:var(--text);font-weight:500}
label.chk input{width:20px;height:20px;margin:0;accent-color:var(--gold)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--text-mute);margin:6px 0 12px;line-height:1.4}

/* Menú de ajustes */
.settings-menu { display: flex; flex-direction: column; gap: 10px; }
.settings-item { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: 16px; cursor: pointer; color: var(--text); transition: background 0.15s; }
.settings-item:active { background: var(--surface2); }
.settings-item .icon-box { width: 40px; height: 40px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; color: var(--gold-soft); }
.settings-item .icon-box svg { width: 20px; height: 20px; stroke-width: 2; fill: none; stroke: currentColor; }
.settings-item .text-box { flex: 1; }
.settings-item .text-box h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.settings-item .text-box p { margin: 0; font-size: 12px; color: var(--text-mute); }

/* FAB */
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(84px + env(safe-area-inset-bottom));
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1000;border:0;border-radius:99px;
  padding:15px 22px;font:700 15px var(--sans);box-shadow:0 8px 24px rgba(224,169,59,.35);z-index:5;cursor:pointer}
.fab:active{transform:scale(.96)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;max-width:160px;background:none;border:0;padding:10px 0 12px;
  font:600 11px var(--sans);color:var(--text-mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold-soft)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:20;
  overflow-y:auto;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;border-radius:22px 22px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));margin-top:40px;min-height:30vh;color:var(--text);
  border-top:1px solid var(--border)}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh-actions { display: flex; gap: 8px; }
.x{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;
  border-radius:50%;font-size:16px;cursor:pointer;display:grid;place-items:center;}
.x svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }

/* Recibo en modal */
.rcvw{overflow-x:auto;margin-bottom:14px;border-radius:8px;-webkit-overflow-scrolling:touch}
.rcv{width:1100px;max-width:none;height:auto;border-radius:8px;border:1px solid var(--border);
  box-shadow:0 6px 18px rgba(0,0,0,.3);background:#fffdf7;display:block;margin-bottom:14px}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.acts .full{grid-column:1/-1}

.sigwrap{border:1.5px dashed var(--border);border-radius:12px;background:#fff;margin:6px 0 10px}
.sigwrap canvas{width:100%;height:auto;display:block;touch-action:none}
.sigimg{max-height:70px;display:block;margin:6px 0;background:#fff;padding:6px;border-radius:6px}

/* Reporte */
.rp{color:var(--text)}
.rp table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 16px;min-width:470px}
.rp th,.rp td{border-bottom:1px solid var(--border);padding:7px 6px;text-align:right;white-space:nowrap;color:var(--text)}
.rp th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-mute);font-weight:700}
.rp th:first-child,.rp td:first-child{text-align:left}
.rp tfoot td{font-weight:700;border-top:2px solid var(--gold);color:var(--gold-soft)}
.rp h3{font:700 16px var(--serif);margin:14px 0 2px;color:var(--gold-soft)}
.rp .neg{color:var(--bad)}
.tw{overflow-x:auto}
.rhead{text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.rhead h2{font:700 24px var(--serif);margin-bottom:4px;color:var(--gold-soft)}
.rhead .sub{font-size:16px;font-weight:600;color:var(--text)}
.rhead .address{font-size:14px;color:var(--text-mute);margin-bottom:12px}
.rhead .details{font-size:12px;color:var(--text-mute);line-height:1.6}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--surface2);color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;
  z-index:40;max-width:88%;text-align:center;border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.4)}

#offlineBar{position:fixed;left:0;right:0;top:0;background:var(--warn);color:#1a1000;
  font-size:13px;text-align:center;padding:6px;z-index:30;display:none;font-weight:600}
body.offline #offlineBar{display:block}

#printArea,#printReport{display:none}
#printArea img{width:100%;height:auto;display:block}
@page{size:A4 portrait;margin:10mm}
@media print{
  #app,#modal,#toast,#offlineBar,#lockScreen,#confirmModal{display:none!important}
  #printArea{display:block!important}
  body.pr-rep #printArea{display:none!important}
  body.pr-rep #printReport{display:block!important}
  html,body{background:#fff;color:#111}
  #printReport .rp{color:#111}
  #printReport .rp table{min-width:0;font-size:11px}
  #printReport .rp th,#printReport .rp td{color:#111;border-color:#ccc}
  #printReport .rp th{color:#555}
  #printReport .tw{overflow:visible}
  #printReport .rp tr{break-inside:avoid}
}

/* Lock Screen */
#lockScreen{position:fixed;inset:0;background:linear-gradient(160deg,#0a1614,#0f2521);z-index:9999;
  display:none;flex-direction:column;align-items:center;justify-content:center;color:var(--text);padding:20px}
#lockScreen .kicker{margin-bottom:10px;font-size:13px;color:var(--gold-soft);letter-spacing:.15em}
#lockScreen h2{font:700 30px var(--serif);margin-bottom:30px;color:var(--text)}
#lockPin{width:220px;font-size:32px;letter-spacing:12px;text-align:center;
  background:var(--surface2);border:2px solid var(--border);color:var(--text);border-radius:16px;padding:15px}
#lockPin:focus{border-color:var(--gold);outline:none}
#lockBtn{margin-top:20px;padding:13px 44px;font-size:16px;border-radius:12px;border:0;
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1000;font-weight:700;cursor:pointer}
.lockErr{color:var(--bad);margin-top:10px;font-size:14px;height:20px}

/* Confirm Modal */
#confirmModal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;
  max-width:400px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.confirm-box p{font-size:16px;margin:0 0 20px 0;color:var(--text);line-height:1.5}
.confirm-box .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
</style>
</head>
<body>
<div id="offlineBar">Sin conexión — tus cambios se guardan igual en este dispositivo</div>
<div id="lockScreen">
  <div class="kicker">MI CASA EN ALQUILER</div>
  <h2>Ingresa tu PIN</h2>
  <input type="password" id="lockPin" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="••••">
  <div class="lockErr" id="lockErr"></div>
  <button id="lockBtn" onclick="intentarDesbloquear()">Desbloquear</button>
</div>
<div id="app" class="hidden">
  <header class="top">
    <div><div class="kicker">Control de alquiler</div><h1 id="hTitle">Mi casa</h1></div>
    <div class="keybadge">⌂</div>
  </header>
  <main id="main"></main>
  <button class="fab" data-a="nuevo">＋ Cobro</button>
  <nav class="tabs">
    <button data-a="tab" data-id="inicio" id="t_inicio">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Inicio
    </button>
    <button data-a="tab" data-id="pagos" id="t_pagos">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Pagos
    </button>
    <button data-a="tab" data-id="reporte" id="t_reporte">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Reporte
    </button>
    <button data-a="tab" data-id="ajustes" id="t_ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Ajustes
    </button>
  </nav>
</div>
<div id="modal" class="modal hidden"></div>
<div id="printArea"><img id="printImg" alt="Recibo"></div>
<div id="printReport"></div>
<input type="file" id="fileImp" accept="application/json,.json,text/plain" class="hidden">
<div id="toast" class="hidden"></div>

<div id="confirmModal">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="acts">
      <button class="btn line" onclick="cerrarConfirm(false)">Cancelar</button>
      <button class="btn danger" onclick="cerrarConfirm(true)">Aceptar</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================= Datos ================= */
var KEY='alquiler_v1';

function nuevoSecreto(){
  var a=new Uint8Array(12);
  try{crypto.getRandomValues(a);}catch(e){for(var i=0;i<12;i++)a[i]=Math.floor(Math.random()*256);}
  return Array.prototype.map.call(a,function(b){return b.toString(16).padStart(2,'0');}).join('');
}

function p2(n){return String(n).padStart(2,'0');}
function r2(n){return Math.round(n*100)/100;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function ymNow(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1);}
function ymAdd(ym,n){var a=ym.split('-').map(Number);var d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1);}
function mesNombre(y,m){return cap(new Date(Number(y),m-1,1).toLocaleDateString('es',{month:'long'}));}

/* ===== Períodos ===== */
function periodoInicioDeMes(ym){
  var a=ym.split('-').map(Number),y=a[0],m=a[1];
  var dia=Math.min(S.cfg.dia||1,new Date(y,m,0).getDate());
  return y+'-'+p2(m)+'-'+p2(dia);
}
function periodoInicioDeFecha(iso){
  var a=iso.split('-').map(Number),y=a[0],m=a[1],d=a[2];
  var dia=Math.min(S.cfg.dia||1,new Date(y,m,0).getDate());
  if(d>=dia)return y+'-'+p2(m)+'-'+p2(dia);
  var pm=m-1,py=y;if(pm<1){pm=12;py--;}
  var pdia=Math.min(S.cfg.dia||1,new Date(py,pm,0).getDate());
  return py+'-'+p2(pm)+'-'+p2(pdia);
}
function periodoFin(inicio){
  var a=inicio.split('-').map(Number),y=a[0],m=a[1];
  var ym=ymAdd(y+'-'+p2(m),1).split('-').map(Number);
  var diaFin=Math.min(S.cfg.dia||1,new Date(ym[0],ym[1],0).getDate());
  return ym[0]+'-'+p2(ym[1])+'-'+p2(diaFin);
}
function periodoLabel(inicio){
  var a=inicio.split('-').map(Number);
  var fin=periodoFin(inicio),f=fin.split('-').map(Number);
  var mi=new Date(a[0],a[1]-1,a[2]).toLocaleDateString('es',{day:'numeric',month:'short'});
  var mf=new Date(f[0],f[1]-1,f[2]).toLocaleDateString('es',{day:'numeric',month:'short'});
  return cap(mi)+' '+a[0]+' - '+cap(mf)+' '+f[0];
}
function periodoAdd(inicio,n){
  var a=inicio.split('-').map(Number);
  var ym=ymAdd(a[0]+'-'+p2(a[1]),n);
  return periodoInicioDeMes(ym);
}

/* ===== Número a letras ===== */
function seccion(n){
  var U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  var D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  var C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  if(n===100)return'cien';
  var s='',c=Math.floor(n/100),r=n%100;
  if(c)s+=C[c]+(r?' ':'');
  if(r<30)s+=U[r];else{var d=Math.floor(r/10),u=r%10;s+=D[d]+(u?' y '+U[u]:'');}
  return s.trim();
}
function apocopar(s){return s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');}
function enteroLetras(n){
  if(n===0)return'cero';
  var mill=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),res=n%1000,p=[];
  if(mill)p.push(mill===1?'un millón':apocopar(seccion(mill))+' millones');
  if(mil)p.push(mil===1?'mil':apocopar(seccion(mil))+' mil');
  if(res)p.push(seccion(res));
  return p.join(' ');
}
function montoLetras(m){
  var ent=Math.floor(m+1e-9),cc=Math.round((m-ent)*100);
  if(ent>=1e9)return money(m);
  var nom=S.cfg.monedaNombre||'dólares';
  if(ent===1)nom=nom.replace(/res$/,'r').replace(/s$/,'');
  var txt=apocopar(enteroLetras(ent));
  if(ent>0&&ent%1000000===0)nom='de '+nom;
  return cap(txt)+' '+nom+' con '+p2(cc)+'/100';
}

/* ===== Verificación ===== */
function hash53(str){
  var h1=0xdeadbeef,h2=0x41c6ce57;
  for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function codigoVerif(p){
  var s=hash53([p.num,p.fecha,p.monto.toFixed(2),S.cfg.secreto].join('|')).toString(36).toUpperCase().padStart(8,'0').slice(0,8);
  return s.slice(0,4)+'-'+s.slice(4);
}

/* ===== PIN Hash ===== */
async function hashPin(pin){
  var data=new TextEncoder().encode(pin+'|'+(S.cfg.secreto||''));
  var buf=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function migrarPin(){
  if(S.cfg.pin&&!S.cfg.pinHash){
    S.cfg.pinHash=await hashPin(S.cfg.pin);
    delete S.cfg.pin;
    guardar();
  }
}

  for(var pos=size-7;r.length<n;pos-=step)r.splice(1,0,pos);
  return r;
}
function qrMatrix(text){

    spec=QR_BLK[ver];dataTotal=0;spec[1].forEach(function(b){dataTotal+=b[0]*b[1];});

  for(i=0;i<ecLen;i++)blocks.forEach(function(b){fin.push(b.e[i]);});
  var size=ver*4+17,M=[],F=[];

  function bit(x,n){return((x>>>n)&1)!==0;}
  for(i=0;i<size;i++){setFn(6,i,i%2===0);setFn(i,6,i%2===0);}

    for(var ay=-2;ay<=2;ay++)for(var ax=-2;ax<=2;ax++)setFn(ap[i]+ax,ap[j]+ay,Math.max(Math.abs(ax),Math.abs(ay))!==1);
  }
  function formato(mask){
    var data=(0<<3)|mask,rem=data;
    for(var q=0;q<10;q++)rem=(rem<<1)^((rem>>>9)*0x537);

        case 1:inv=y%2===0;break;

        case 3:inv=(x+y)%3===0;break;
        case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2===0;break;

      run=1;for(x=1;x<size;x++){if(M[x][y]===M[x-1][y]){run++;if(run===5)s+=3;else if(run>5)s++;}else run=1;}
    }

    for(y=0;y<size;y++){

function dibujarQR(c,text,x,y,size){
  var m=qrMatrix(text),n=m.length,cell=Math.max(1,Math.floor(size/(n+4))),tot=cell*(n+4),ox=x+Math.floor((size-tot)/2),oy=y+Math.floor((size-tot)/2);

/* ================= Lógica de cobros ================= */
function esAlq(p){return p.concepto==='Alquiler';}
function sumPeriodo(inicio){
  return S.pagos.reduce(function(t,p){
    if(p.anulado||!esAlq(p)||p.periodo!==inicio)return t;
    return t+p.monto;
  },0);
}
function saldoAnterior(periodoActual){
  var totalEsperado=0;
  var pagosAnteriores=0;
  var iniContrato=S.cfg.inicio?periodoInicioDeFecha(S.cfg.inicio):periodoActual;
  var p=iniContrato;
  while(p < periodoActual){
    totalEsperado+=S.cfg.renta;
    p=periodoAdd(p,1);
  }
  S.pagos.forEach(function(px){
    if(px.anulado||!esAlq(px)||!px.periodo)return;
    if(px.periodo < periodoActual) pagosAnteriores+=px.monto;
  });
  return r2(pagosAnteriores - totalEsperado);
}
function estadoPeriodo(inicio){
  var esperado=S.cfg.renta;
  var saldoPrev = saldoAnterior(inicio);
  var esperadoReal = Math.max(0, r2(esperado - saldoPrev));
  var pagado=sumPeriodo(inicio);
  var pendiente=Math.max(0,r2(esperadoReal-pagado));
  var fin=periodoFin(inicio).split('-').map(Number);
  var venc=new Date(fin[0],fin[1]-1,fin[2]);
  var h=new Date();h=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  var estado='pend',txt='Pendiente';
  if(esperadoReal>0&&pendiente<=0){estado='ok';txt='Pagado';}
  else if(h>venc){estado='mora';txt=pagado>0?'Pago incompleto · vencido':'Vencido';}
  else if(pagado>0){txt='Pago parcial';}
  return{esperado:esperadoReal,pagado:pagado,pendiente:pendiente,venc:venc,estado:estado,txt:txt,inicio:inicio,saldoPrev:saldoPrev};
}
function periodosPendientes(){
  if(!S.cfg.inicio||!S.cfg.renta)return[];
  var out=[],hoy=periodoInicioDeFecha(hoyISO());
  var ini=periodoInicioDeFecha(S.cfg.inicio),guard=0;
  while(ini<=hoy&&guard++<240){
    var e=estadoPeriodo(ini);
    if(e.pendiente>0)out.push({inicio:ini,pend:e.pendiente});
    ini=periodoAdd(ini,1);
  }
  return out.slice(-12);
}
function proxNum(){
  var n=S.cfg.siguiente,num;
  do{num=(S.cfg.prefijo||'REC')+'-'+String(n).padStart(4,'0');n++;}while(S.pagos.some(function(p){return p.num===num;}));
  return{num:num,next:n};
}
function cambio(){S.cfg.cambios=(S.cfg.cambios||0)+1;}

function migrarPeriodos(){
  var n=0;
  S.pagos.forEach(function(p){
    if(p.periodo&&/^\d{4}-\d{2}$/.test(p.periodo)){
      p.periodo=periodoInicioDeMes(p.periodo);n++;
    }
    if(p.rentaRef)delete p.rentaRef;
    if(p.corr)delete p.corr;
  });
  if(n)guardar();
}

function migrarCargos(){
  if(!S.cargos)S.cargos=[];
  S.pagos.forEach(function(p){
    if(p.anulado)return;
    if(p.concepto==='Mora / recargo'||p.concepto==='Reparación'){
      var existe=S.cargos.some(function(c){return c.pagoId===p.id;});
      if(!existe){
        S.cargos.push({
          id:'c'+p.id,pagoId:p.id,fecha:p.fecha,monto:p.monto,
          concepto:p.concepto,otro:p.otro||'',saldado:true,saldadoFecha:p.fecha
        });
      }
    }
  });
  guardar();
}

/* ===== Reporte ===== */
function datosAnio(y){
  var periodos=[],cobrado=0,pendiente=0,metodos={};
  S.pagos.forEach(function(p){
    if(!p.anulado&&p.fecha.slice(0,4)===String(y)){
      cobrado+=p.monto;
      metodos[metodoTxt(p)]=(metodos[metodoTxt(p)]||0)+p.monto;
    }
  });
  var iniContrato = S.cfg.inicio ? periodoInicioDeFecha(S.cfg.inicio) : null;
  for(var m=1;m<=12;m++){
    var ym=y+'-'+p2(m),inicio=periodoInicioDeMes(ym);
    if(iniContrato && inicio < iniContrato)continue;
    var e=estadoPeriodo(inicio);
    var fin=periodoFin(inicio),otros=0;
    S.pagos.forEach(function(p){
      if(p.anulado||esAlq(p))return;
      if(p.fecha>=inicio&&p.fecha<fin)otros+=p.monto;
    });
    if(e.estado==='mora') pendiente+=e.pendiente;
    periodos.push({inicio:inicio,esp:e.esperado,alq:e.pagado,saldo:e.estado==='mora'?e.pendiente:0,otros:otros,estado:e.estado});
  }
  return{periodos:periodos,cobrado:r2(cobrado),pendiente:r2(pendiente),metodos:metodos};
}

function csvEscape(v){
  var s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}

    rows.push([p.fecha,p.num,conceptoTxt(p),p.periodo?periodoLabel(p.periodo):'',p.monto.toFixed(2),metodoTxt(p),p.ref,p.notas,p.anulado?'ANULADO':'Vigente']);

  var txt=rows.map(function(r){return r.map(csvEscape).join(',');}).join('\r\n');
  descargar(new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'}),'reporte_alquiler_'+y+'.csv');
}

var montoDirty=false;
function corrDefault(inicio){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(inicio||''))return inicio||'—';
  var a=inicio.split('-').map(Number),f=periodoFin(inicio).split('-').map(Number);
  function nm(m){return mesNombre(2000,m).toLowerCase();}
  return a[2]+' de '+nm(a[1])+(a[0]!==f[0]?' de '+a[0]:'')+' al '+f[2]+' de '+nm(f[1])+' de '+f[0];
}

/* ===== Liquidación ===== */
function abrirLiquidacion(){
  var dep=0;
  S.pagos.forEach(function(p){
    if(p.anulado)return;
    if(p.concepto==='Depósito de garantía')dep+=p.monto;
  });
  var pend=periodosPendientes();
  var debeAlq=pend.reduce(function(t,x){return t+x.pend;},0);
  var cargosPendientes=(S.cargos||[]).filter(function(c){return !c.saldado;});
  var debeCargos=cargosPendientes.reduce(function(t,c){return t+c.monto;},0);
  var totalDeuda=r2(debeAlq+debeCargos);
  var saldoFinal=r2(dep-totalDeuda);
  var colorSaldo=saldoFinal>=0?'var(--ok)':'var(--bad)';
  var bgSaldo=saldoFinal>=0?'rgba(74,222,128,.12)':'rgba(248,113,113,.12)';
  var borderSaldo=saldoFinal>=0?'rgba(74,222,128,.3)':'rgba(248,113,113,.3)';

  abrirModal(
    '<div class="sh-h"><h2>Liquidar Contrato</h2><button class="x" data-a="cerrar">✕</button></div>'+
    '<p class="hint">El depósito se devuelve menos las deudas vigentes. Los cargos ya saldados no se descuentan.</p>'+
    '<div class="stats" style="margin-bottom:12px">'+
      '<div class="stat"><small>Depósito recibido</small><b>'+money(dep)+'</b></div>'+
      '<div class="stat"><small>Alquiler pendiente</small><b>'+money(debeAlq)+'</b></div>'+
    '</div>'+
    '<div class="stats" style="margin-bottom:12px">'+
      '<div class="stat"><small>Cargos pendientes</small><b>'+money(debeCargos)+'</b></div>'+
      '<div class="stat" style="background:'+bgSaldo+';border-color:'+borderSaldo+'"><small>'+((saldoFinal>=0)?'Devolver al inquilino':'El inquilino debe pagar')+'</small><b style="color:'+colorSaldo+'">'+money(Math.abs(saldoFinal))+'</b></div>'+
    '</div>'+
    (cargosPendientes.length?'<div class="sec">Cargos que se descuentan</div>'+cargosPendientes.map(function(c){
      return '<div class="row" style="margin-bottom:6px;cursor:default"><div class="rm"><div>'+esc(c.concepto==='Otro'?(c.otro||'Otro'):c.concepto)+'</div><small>'+fechaCorta(c.fecha)+'</small></div><div class="rr">'+money(c.monto)+'</div></div>';
    }).join(''):'<div class="hint">No hay cargos pendientes.</div>')+
    (pend.length?'<div class="sec">Alquileres pendientes</div>'+pend.map(function(x){
      return '<div class="row" style="margin-bottom:6px;cursor:default"><div class="rm"><div>'+esc(periodoLabel(x.inicio))+'</div></div><div class="rr">'+money(x.pend)+'</div></div>';
    }).join(''):'')+
    '<button class="btn primary" onclick="cerrarModal()" style="margin-top:14px">Entendido</button>'
  );
}

function autoMonto(){
  if(montoDirty)return;
  var c=$('#f_concepto').value,per=$('#f_periodo')?$('#f_periodo').value:'';
  if(c==='Alquiler'&&per){var e=estadoPeriodo(per);$('#f_monto').value=e.pendiente>0?e.pendiente:S.cfg.renta;}
  else if(c!=='Alquiler')$('#f_monto').value='';
}

function guardarPago(){
  vibrar(15);
  var monto=toNum($('#f_monto').value),fecha=$('#f_fecha').value,concepto=$('#f_concepto').value;
  if(!fecha){toast('Indica la fecha del pago');return;}
  if(monto<0){toast('El monto no puede ser negativo');return;}
  var otro=$('#f_otro').value.trim();
  if(concepto==='Otro'&&!otro){toast('Describe el concepto');return;}
  var per=$('#f_periodo')?$('#f_periodo').value:'';
  if(concepto==='Alquiler'&&!per){toast('Indica el período que cubre el pago');return;}
  var metodo=$('#f_metodo').value;
  var metodoOtro=$('#f_metodoOtro').value.trim();
  if(metodo==='Otro'&&!metodoOtro){toast('Describe la forma de pago');return;}

  if(monto===0){
    var e=estadoPeriodo(per);
    var esCredito=e.saldoPrev>0&&e.pendiente===0;
    if(!esCredito){toast('El monto debe ser mayor que cero');return;}
  }

  if(fecha>hoyISO()){toast('La fecha no puede ser futura');return;}
  if(S.cfg.inicio&&fecha<S.cfg.inicio){toast('La fecha no puede ser anterior al inicio del contrato');return;}

  if(concepto==='Alquiler'&&per){
    var e2=estadoPeriodo(per);
    if(monto>e2.pendiente+0.001&&e2.pendiente>0){
      abrirConfirm('El monto ('+money(monto)+') supera el pendiente ('+money(e2.pendiente)+'). Se registrará como sobrepago. ¿Continuar?',
        function(ok){if(ok)_doGuardarPago(monto,fecha,concepto,otro,per,metodo,metodoOtro);});
      return;
    }
  }
  _doGuardarPago(monto,fecha,concepto,otro,per,metodo,metodoOtro);
}

function _doGuardarPago(monto,fecha,concepto,otro,per,metodo,metodoOtro){
  var n=proxNum();
  S.seq++;
  
  var desglose = $('#f_desglose') ? $('#f_desglose').value.trim() : '';
  var cargoId = $('#f_monto') ? $('#f_monto').dataset.cargoId : null;
  
  var p={
    id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    seq:S.seq,
    num:n.num,
    fecha:fecha,
    monto:monto,
    concepto:concepto,
    otro:otro,
    periodo:concepto==='Alquiler'?per:'',
    metodo:metodo,
    metodoOtro:metodoOtro,
    desglose:desglose,
    ref:$('#f_ref').value.trim(),
    notas:$('#f_notas').value.trim(),
    anulado:false
  };
  S.pagos.push(p);S.cfg.siguiente=n.next;

  if(cargoId && S.cargos){
    var cargo = S.cargos.find(function(c){return c.id===cargoId;});
    if(cargo){
      cargo.saldado = true;
      cargo.saldadoFecha = fecha;
      cargo.pagoId = p.id;
    }
  } else if(concepto==='Mora / recargo'||concepto==='Reparación'){
    if(!S.cargos)S.cargos=[];
    S.cargos.push({id:'c'+p.id,pagoId:p.id,fecha:fecha,monto:monto,concepto:concepto,otro:otro,saldado:true,saldadoFecha:fecha});
  }

  cambio();guardar();
  ui.periodo=per||ui.periodo;cerrarModal();render();abrirRecibo(p.id);autoRespaldo();
}

/* ================= Dibujo del recibo ================= */
function wrap(c,text,maxW){
  var words=String(text).split(/\s+/),lines=[],cur='';
  words.forEach(function(w){var t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});
  if(cur)lines.push(cur);return lines;
}
function cargarImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){res(null);};i.src=src;});}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
async function dibujar(p){
  var tieneNotas=!!(p.notas&&p.notas.trim());
  var W=3200, H=(tieneNotas?1526:1380);
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var c=cv.getContext('2d'),cf=S.cfg;

  c.fillStyle='#fffdf7';c.fillRect(0,0,W,H);
  c.strokeStyle='#0f4c47';c.lineWidth=10;c.strokeRect(20,20,W-40,H-40);
  c.lineWidth=3;c.strokeRect(36,36,W-72,H-72);

  var LW=850;
  c.fillStyle='#0f4c47';c.fillRect(36,36,LW,H-72);
  c.fillStyle='#e0a93b';c.fillRect(36+LW,36,8,H-72);

  c.fillStyle='#333';c.font='700 34px '+SANS;c.textAlign='center';c.fillText('VALOR RECIBIDO',mx+mw/2,my+54);
  c.fillStyle='#000';c.font='700 112px '+SERIF;c.fillText(money(p.monto),mx+mw/2,my+160);c.textAlign='left';

  var pieY=H-310;
  var campoIni=300,campoFin=pieY-40;
  var filas=tieneNotas?6:5;
  var filaH=(campoFin-campoIni)/filas;
  var y=campoIni;
  function campo(label,val,italic){
    c.fillStyle='#333';c.font='700 38px '+SANS;c.fillText(label.toUpperCase(),x0,y+56);
    c.fillStyle='#000';c.font=(italic?'italic ':'')+'56px '+SERIF;
    var vx=x0+570,vw=xr-vx;
    wrap(c,val,vw).slice(0,2).forEach(function(ln,i){c.fillText(ln,vx,y+56+i*62);});
    c.strokeStyle='#8a8a8a';c.lineWidth=3;c.setLineDash([6,10]);
    c.beginPath();c.moveTo(x0,y+filaH-12);c.lineTo(xr,y+filaH-12);c.stroke();c.setLineDash([]);

  if(p.anulado){
    c.save();c.translate(W/2,H/2);c.rotate(-0.28);c.globalAlpha=0.25;c.fillStyle='#b3372b';
    c.font='700 300px '+SANS;c.textAlign='center';c.textBaseline='middle';c.fillText('ANULADO',0,0);c.restore();
  }
  return cv;
}

/* ================= PDF ================= */
async function pdfDesdeCanvas(cv){
  var blob=await new Promise(function(r){cv.toBlob(r,'image/jpeg',0.97);});
  var jpg=new Uint8Array(await blob.arrayBuffer());
  var W=595,H=842;
  var iw=535,ih=Math.round(iw*cv.height/cv.width);
  var x=(W-iw)/2,y=H-40-ih,yc=y-12;
  var enc=new TextEncoder(),parts=[],off=[],len=0;
  function push(d){var u=typeof d==='string'?enc.encode(d):d;parts.push(u);len+=u.length;}
  function obj(n,b){off[n]=len;push(n+' 0 obj\n'+b+'\nendobj\n');}
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4]=len;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');
  push(jpg);push('\nendstream\nendobj\n');
  var content='q '+iw+' 0 0 '+ih+' '+x+' '+y+' cm /Im0 Do Q q 0.55 G 0.6 w [5 4] 0 d 20 '+yc+' m '+(W-20)+' '+yc+' l S Q';
  obj(5,'<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  var xref=len,t='xref\n0 6\n0000000000 65535 f \n';
  for(var i=1;i<=5;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  t+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  push(t);
  return new Blob(parts,{type:'application/pdf'});
}

function reciboActual(){return S.pagos.find(function(x){return x.id===ui.rid;});}
function textoRecibo(p){
  return 'Recibo '+p.num+'\n'+(S.cfg.propiedad||'')+'\nRecibí de: '+S.cfg.inquilino+'\nValor: '+money(p.monto)+'\nConcepto: '+conceptoTxt(p)+(esAlq(p)&&p.periodo?' ('+periodoLabel(p.periodo)+')':'')+'\nFecha: '+fechaLarga(p.fecha)+'\nFirma: '+(S.cfg.propietario||'')+'\nRef. interna: '+codigoVerif(p);

async function compartir(tipo){
  var p=reciboActual();if(!p)return;
  try{
    var cv=await dibujar(p),name='Recibo_'+p.num,blob,file;
    if(tipo==='pdf'){blob=await pdfDesdeCanvas(cv);file=new File([blob],name+'.pdf',{type:'application/pdf'});}
    else{blob=await new Promise(function(r){cv.toBlob(r,'image/png');});file=new File([blob],name+'.png',{type:'image/png'});}
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Recibo '+p.num,text:textoRecibo(p)});return;}
      catch(e){if(e&&e.name==='AbortError')return;}
    }
    descargar(blob,file.name);toast('Archivo descargado. Adjúntalo en WhatsApp o correo.');
  }catch(e){toast('No se pudo generar el archivo');}

var sig={d:false,ctx:null,has:false};
function initFirma(){
  var cv=$('#sig');if(!cv)return;
  var c=cv.getContext('2d');c.lineWidth=3.5;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#0b2a63';sig.ctx=c;sig.has=false;
  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();sig.d=true;sig.has=true;var q=pos(e);c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x+.1,q.y+.1);c.stroke();try{cv.setPointerCapture(e.pointerId);}catch(x){}});
  cv.addEventListener('pointermove',function(e){if(!sig.d)return;e.preventDefault();var q=pos(e);c.lineTo(q.x,q.y);c.stroke();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){cv.addEventListener(t,function(){sig.d=false;});});
}

function marcarRespaldo(){
  S.cfg.lastBackup=Date.now();
  S.cfg.cambios=0;
  S.cfg.pagosDesdeRespaldo=S.pagos.length;
  guardar();refrescar();
}
function nombreRespaldo(){return 'respaldo_alquiler_'+hoyISO()+'.json';}
function descargarResp(){
  descargar(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),nombreRespaldo());
  marcarRespaldo();toast('Respaldo descargado');
}
async function enviarRespaldo(){
  var txt=JSON.stringify(S,null,1),name=nombreRespaldo(),tipos=['application/json','text/plain'],file=null,i;
  if(navigator.canShare){
    for(i=0;i<tipos.length&&!file;i++){
      var f=new File([txt],name,{type:tipos[i]});
      if(navigator.canShare({files:[f]}))file=f;
    }
  }
  if(file){
    try{await navigator.share({files:[file],title:'Respaldo Mi Casa en Alquiler',text:'Respaldo del '+fechaCorta(hoyISO())});marcarRespaldo();return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  descargar(new Blob([txt],{type:'application/json'}),name);marcarRespaldo();
  var mail=(S.cfg.correoRespaldo||'').trim();
  if(mail){
    toast('Archivo descargado. Se abrirá tu correo: adjunta el archivo.');
    setTimeout(function(){window.location.href='mailto:'+mail+'?subject='+encodeURIComponent('Respaldo Mi Casa en Alquiler '+hoyISO())+'&body='+encodeURIComponent('Adjunta el archivo '+name);},900);
  }else toast('Archivo descargado. Guárdalo en tu correo o Drive.');
}
function validarRespaldo(d){
  var errs=[];
  if(!d||typeof d!=='object'){errs.push('formato desconocido');return errs;}
  if(!d.cfg||typeof d.cfg!=='object'){errs.push('falta cfg');}
  if(!Array.isArray(d.pagos)){errs.push('falta pagos[]');return errs;}
  var numeros={};
  d.pagos.forEach(function(p,i){
    if(!p||typeof p!=='object'){errs.push('pago '+i+' inválido');return;}
    if(typeof p.num!=='string'||!p.num){errs.push('pago '+i+' sin número');}
    if(typeof p.monto!=='number'||p.monto<0){errs.push('pago '+i+' monto inválido');}
    if(typeof p.fecha!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(p.fecha)){errs.push('pago '+i+' fecha inválida');}
    if(numeros[p.num]){errs.push('número duplicado: '+p.num);}
    numeros[p.num]=true;
  });
  return errs;
}
function importar(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      var errs=validarRespaldo(d);
      if(errs.length){toast('Respaldo inválido: '+errs[0]);return;}
      if(!confirm('Esto reemplazará los datos actuales por el respaldo ('+d.pagos.length+' pagos). ¿Continuar?'))return;
      var base=defaults();
      S={cfg:Object.assign(base.cfg,d.cfg),pagos:d.pagos,cargos:d.cargos||[],seq:d.seq||d.pagos.length};
      if(!S.cfg.secreto)S.cfg.secreto=nuevoSecreto();
      migrarPeriodos();migrarCargos();guardar();render();toast('Respaldo restaurado');
      aplicarTema();
    }catch(e){toast('El archivo no es un respaldo válido');}
  };
  r.readAsText(file);
}

function autoRespaldo(){
  var pagosDesde=S.pagos.length-(S.cfg.pagosDesdeRespaldo||0);
  var diasDesde=(Date.now()-(S.cfg.lastBackup||0))/864e5;
  if(pagosDesde>=5||(pagosDesde>=1&&diasDesde>=7)){
    descargar(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),nombreRespaldo());
    marcarRespaldo();
    toast('Respaldo automático descargado');
  }
}

  else if(id==='anioR'){ui.anioR=e.target.value;render();}
  else if(id==='f_concepto'){
    var val=e.target.value;
    var reqMes=['Alquiler','Agua','Luz','Internet','Mora / recargo'].indexOf(val)>=0;
    $('#w_otro').classList.toggle('hidden',val!=='Otro');
    $('#w_corr').classList.toggle('hidden',!reqMes);
    autoMonto();
  }
  else if(id==='d_concepto'){
    $('#d_otro_wrap').classList.toggle('hidden',e.target.value!=='Otro');
  }
  else if(id==='f_metodo'){
    $('#w_metodoOtro').classList.toggle('hidden',e.target.value!=='Otro');
    $('#w_desglose').classList.toggle('hidden',e.target.value!=='Pago Mixto');
  }
  else if(id==='e_metodo'){
    $('#e_metodoOtro_box').classList.toggle('hidden',e.target.value!=='Otro');
    $('#e_desglose_box').classList.toggle('hidden',e.target.value!=='Pago Mixto');
  }
  else if(id==='f_periodo'){autoMonto();}
  else if(id==='c_correo'){S.cfg.correoRespaldo=e.target.value.trim();guardar();}
  else if(id==='c_pin_on'){$('#pin_box').classList.toggle('hidden',!e.target.checked);}
  else if(id==='fileImp'&&e.target.files[0]){importar(e.target.files[0]);e.target.value='';}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')cerrarModal();});
window.addEventListener('afterprint',function(){document.body.classList.remove('pr-rep');});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(ui.vista==='ajustes')render();});

function updateOnline(){document.body.classList.toggle('offline',!navigator.onLine);}
window.addEventListener('online',function(){updateOnline();toast('Conexión restablecida');});
window.addEventListener('offline',updateOnline);

/* ================= PIN ================= */
window.intentarDesbloquear=async function(){
  if(Date.now()<bloqPinHasta){
    var seg=Math.ceil((bloqPinHasta-Date.now())/1000);
    $('#lockErr').textContent='Bloqueado '+seg+'s';
    return;
  }
  var pin=$('#lockPin').value;
  if(pin.length!==4){$('#lockErr').textContent='PIN de 4 dígitos';return;}
  var hashIngresado=await hashPin(pin);
  if(hashIngresado===S.cfg.pinHash){
    intentosPin=0;
    $('#lockScreen').style.display='none';
    $('#app').classList.remove('hidden');
    $('#lockPin').value='';$('#lockErr').textContent='';
  }else{
    intentosPin++;
    $('#lockPin').value='';
    if(intentosPin>=5){
      bloqPinHasta=Date.now()+30000;
      intentosPin=0;
      $('#lockErr').textContent='Bloqueado 30s';
    }else{
      $('#lockErr').textContent='PIN incorrecto ('+(5-intentosPin)+' intentos)';
    }
  }
};

/* ================= Arranque ================= */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    window.location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg=>{reg.update();}).catch(function(){});
}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
migrarPeriodos();
migrarCargos();
updateOnline();
aplicarTema();

(async function arrancar(){
  await migrarPin();
  if(S.cfg.pinHash){
    $('#lockScreen').style.display='flex';
    $('#app').classList.add('hidden');
  }else{
    $('#lockScreen').style.display='none';
    $('#app').classList.remove('hidden');
  }
  render();
})();
})();
</script>
